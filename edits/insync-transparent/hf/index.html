<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05070A; }
      #root { position: relative; width: 100%; height: 100%; }
      #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: contain; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.5" data-width="1080" data-height="1920">
      <!-- picture cut and sound, rendered without text by Remotion -->
      <video id="base" class="clip" src="assets/base.mp4" data-start="0" data-duration="23.5" data-track-index="0"
        playsinline data-has-audio="true" data-volume="1"></video>
      <div id="headlines" data-composition-id="headlines" data-composition-src="compositions/headlines.html" data-start="1.0" data-duration="2.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="23.5" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:4"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="20.733" data-duration="2.767" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
